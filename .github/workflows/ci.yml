name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage thresholds
        run: npm run test:unit:coverage

      - name: Socket.io integration tests
        run: npm run test:integration

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser

      - name: Production build and one-port smoke test
        run: npm run test:production-smoke

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          if-no-files-found: warn
          path: |
            coverage/
            playwright-report/
            test-results/
            client/dist/
